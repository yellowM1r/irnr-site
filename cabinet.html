<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Личный кабинет — ИРНР</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="brand"><div class="flag"><img src="https://raw.githubusercontent.com/yellowM1r/irnr-site/main/irnr_flag.png"></div><div><b>ИРНР</b><small>Личный кабинет гражданина</small></div></div><a class="back" href="index.html">← Портал</a></header><main class="cabinet-wrap"><div id="login" class="login-card"><div class="eyebrow">Авторизация</div><h1>Личный кабинет</h1><p>Введите серию и номер гражданства.</p><form id="loginForm"><div class="field"><label>Серия</label><input id="series" inputmode="numeric" required placeholder="0228"></div><div class="field"><label>Номер</label><input id="number" inputmode="numeric" required placeholder="169528"></div><button class="btn primary" type="submit">Войти</button></form><div id="loginResult"></div></div><div id="cabinet" style="display:none"></div></main><script src="script.js"></script><script>const u=JSON.parse(localStorage.getItem('irnr-user')||'null');if(u){document.getElementById('login').style.display='none';document.querySelector('.cabinet-wrap').insertAdjacentHTML('beforeend',`<section><div class="cabinet-header"><div><div class="eyebrow">Гражданин</div><h1>${u.name}</h1></div><button class="btn ghost" id="logout">Выйти</button></div><div class="profile-card"><div class="avatar">${u.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div><small>${u.role}</small><h2 style="margin:4px 0">Личный профиль</h2><span>Гражданин ИРНР</span></div></div><h2 style="margin-top:35px">Мои документы</h2><div class="doc-grid"><details class="doc-card"><summary>Свидетельство о гражданстве</summary><div class="doc-meta"><div><small>Серия</small><b>${u.series}</b></div><div><small>Номер</small><b>${u.number}</b></div><div><small>Выдано</small><b>${u.issued}</b></div></div></details></div><h2 style="margin-top:35px">Государственные программы</h2><div class="service-grid"><a class="service-card empty-tile" href="education.html"><div class="service-icon">+</div><h3>Образование</h3><p>Подать заявление на участие</p></a><a class="service-card empty-tile" href="healthcare.html"><div class="service-icon">+</div><h3>Здравоохранение</h3><p>Подать заявление на участие</p></a></div></section>`;document.getElementById('logout').onclick=()=>{localStorage.removeItem('irnr-user');location.reload()}}</script></body></html>
