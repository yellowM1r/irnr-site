<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Личный кабинет — ИРНР</title><link rel="stylesheet" href="style.css"><link rel="icon" href="https://raw.githubusercontent.com/yellowM1r/irnr-site/main/irnr_flag.png"></head><body class="application-page"><header class="top"><div class="brand"><div class="flag"><img src="https://raw.githubusercontent.com/yellowM1r/irnr-site/main/irnr_flag.png"></div><div><b>ИРНР</b><small>Личный кабинет гражданина</small></div></div><div class="header-actions"><button id="themeToggle" class="theme-btn">☾</button><a class="back-link" href="index.html">← Портал</a></div></header><main class="application-wrap" id="cabinetApp"></main><script src="script.js"></script><script>
const root=document.getElementById('cabinetApp');
function renderLogin(){root.innerHTML=`<div class="application-card"><div class="eyebrow">Единая система доступа</div><h1>Личный кабинет</h1><p class="intro">Войдите по серии и номеру гражданского паспорта ИРНР. Для двух предусмотренных граждан данные уже заведены в государственный реестр проекта.</p><form id="loginForm"><div class="form-grid"><div class="form-field"><label>Серия</label><input id="series" inputmode="numeric" maxlength="4" required></div><div class="form-field"><label>Номер</label><input id="number" inputmode="numeric" maxlength="6" required></div></div><div class="form-actions"><button class="submit-btn">Войти</button><a class="btn ghost" href="index.html">На портал</a></div><p id="loginError" class="form-note" style="display:none"></p></form><div class="form-config">Регистрация нового профиля выполняется по данным уже выданного паспорта.</div></div>`;document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();const a=IRNR.getAccount(series.value,number.value);if(!a){loginError.style.display='block';loginError.textContent='Гражданин с такими данными не найден в реестре проекта.';return}IRNR.setSession(a);location.reload()}}
function renderRegister(){root.innerHTML=`<div class="application-card"><div class="eyebrow">Первичная регистрация</div><h1>Регистрация гражданина</h1><p class="intro">Введите данные, которые совпадают с данными уже выданного паспорта. После проверки профиль будет создан на этом устройстве.</p><form id="regForm"><div class="form-grid"><div class="form-field"><label>Серия</label><input id="rSeries" required></div><div class="form-field"><label>Номер</label><input id="rNumber" required></div><div class="form-field"><label>Фамилия</label><input id="rSurname" required></div><div class="form-field"><label>Дата рождения</label><input id="rDob" type="date"></div></div><div class="form-actions"><button class="submit-btn">Зарегистрироваться</button><button type="button" class="btn ghost" id="toLogin">Уже есть аккаунт</button></div><p id="regError" class="form-note" style="display:none"></p></form></div>`;document.getElementById('toLogin').onclick=renderLogin;document.getElementById('regForm').onsubmit=e=>{e.preventDefault();const a=IRNR.getAccount(rSeries.value,rNumber.value);if(!a||a.surname.toLowerCase()!==rSurname.value.trim().toLowerCase()||(a.dob&&a.dob!==rDob.value)){regError.style.display='block';regError.textContent='Данные не совпали с реестром граждан.';return}IRNR.setSession(a);location.reload()}}
function renderCabinet(a){const msgs=IRNR.messages();root.innerHTML=`<div class="application-card"><div class="head"><div><div class="eyebrow">Личный кабинет гражданина</div><h1>${a.name} ${a.patronymic}</h1><p class="intro">${a.role}. Гражданин №${a.citizenNo}.</p></div><button class="btn ghost" data-logout>Выйти</button></div><div class="profile-grid"><div class="profile-card"><h2>Паспортные данные</h2><div class="doc-row"><span>ФИО</span><strong>${a.surname} ${a.name} ${a.patronymic}</strong></div><div class="doc-row"><span>Серия</span><strong>${a.series}</strong></div><div class="doc-row"><span>Номер</span><strong>${a.number}</strong></div><div class="doc-row"><span>Дата рождения</span><strong>${a.dob||'—'}</strong></div><div class="doc-row"><span>Кем выдан</span><strong>${a.issuedBy}</strong></div><div class="doc-row"><span>Статус</span><strong>${a.role}</strong></div></div><div class="profile-card"><h2>Государственные программы</h2><div class="program-empty"><div><strong>Заявка на здравоохранение</strong><p>${a.health?'Заявка зарегистрирована.':'Заявка пока не подана.'}</p></div><a class="plus-big" href="health.html">+</a></div><br><div class="program-empty"><div><strong>Заявка на обучение</strong><p>${a.education?'Заявка зарегистрирована.':'Заявка пока не подана.'}</p></div><a class="plus-big" href="education.html">+</a></div></div></div>${a.id==='admin'?`<div class="profile-card" style="margin-top:18px"><h2>Входящие обращения главы</h2><p class="intro">Заявки из форм отправляются на подключённый Formspree-адрес. Здесь также отображаются локальные уведомления, созданные в этом браузере.</p>${msgs.length?msgs.map(m=>`<div class="detail-item"><strong>${m.subject||'Новое обращение'}</strong><br><small>${m.date||''}</small><p>${m.text||''}</p></div>`).join(''):'<div class="program-empty"><span>Пока нет локальных обращений.</span><span>✉</span></div>'}</div>`:''}<div class="form-actions" style="margin-top:22px"><a class="btn primary" href="application.html">Подать заявление на гражданство</a><a class="btn ghost" href="index.html">Вернуться на портал</a></div></div>`;document.querySelector('[data-logout]')?.addEventListener('click',()=>{IRNR.logout();location.reload()})}
const account=IRNR.session();account?renderCabinet(account):renderLogin();
</script></body></html>
