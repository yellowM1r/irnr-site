const items={decrees:{date:'1 октября 2026',cat:'Государственные акты',title:'Опубликованы три новых указа Верховного Господина',text:`В официальном архиве ИРНР опубликованы указы №1, №2 и №3, принятые 1 октября 2026 года.`,more:`Указ №1 посвящён государственным символам; указ №2 учреждает систему министерств; указ №3 создаёт Центральный банк ИРНР, Министерство внутренних дел и Верховный суд. Все три документа собраны в отдельном разделе архива.`,link:'archive.html',linkText:'Открыть архив указов →'},protest:{date:'4 октября 2026',cat:'Международные отношения',title:'ИРНР выразила протест Российской Федерации',text:`Израильская Ростовская Народная Республика опубликовала официальное заявление с выражением протеста в связи с разгонами митингов и ограничениями права на мирные собрания.`,more:`В заявлении республика призывает соблюдать гражданские свободы, право на мирные собрания и свободу выражения политической позиции.`,link:'protest-rf.html',linkText:'Открыть заявление →'},'ukraine-docs':{date:'4 октября 2026',cat:'Дипломатия',title:'В архив поступили два документа Посольства Украины',text:`4 октября 2026 года в архиве опубликованы два документа Посольства Украины, адресованные Казакову Мирославу Михайловичу.`,more:`Исх. № 04/10-2026 содержит официальное обращение о признании ИРНР и готовности к развитию дипломатических отношений. Исх. № 05/10-2026 содержит официальное заявление по судебному делу № ИРНР-001. Оригиналы доступны в PDF в дипломатическом архиве.`,link:'ambassador.html',linkText:'Открыть дипломатический архив →'},passport:{date:'1 октября 2026',cat:'Государственное событие',title:'Изготовлен первый бумажный паспорт ИРНР',text:`1 октября 2026 года завершено изготовление первого физического бумажного экземпляра паспорта-реквизита ИРНР. Работа выполнена вручную из картона и бумаги в рамках развития системы государственных документов.`,more:`Экземпляр задуман как символ первого этапа развития гражданской системы. В дальнейшем визуальный дизайн документов проекта будет дорабатываться отдельно от цифрового портала.`},'site-update':{date:'1 октября 2026',cat:'Цифровая инфраструктура',title:'Государственный портал получил крупное обновление',text:`На портале появилась тёмная тема, полноценный личный кабинет, регистрация граждан по серии и номеру паспорта, страницы государственных программ, расширенный раздел новостей и новая обновлённая структура портала.`,more:`Также обновлены карточки граждан, финансовый раздел, формы образования и здравоохранения и навигация. Все новости теперь открываются как отдельные страницы.`},currency:{date:'1 октября 2026',cat:'Финансы',title:'Начата разработка нового дизайна национальной валюты',text:`Начата разработка нового визуального дизайна национальной валюты ИРНР — руханда (RHD). Работа всё ещё находится в процессе. Параллельно в обороте остаются старые дубли.`,more:`Для обменника установлен курс: 1 USD = 850 дублей. Внутренний курс: 1000 дублей = 100 RHD, то есть 1 дубль = 0,1 RHD и 850 дублей = 85 RHD.`},citizenship:{date:'30 сентября 2026',cat:'Гражданство',title:'Поступила первая заявка на гражданство',text:`30 сентября 2026 года отдел гражданства зарегистрировал первую электронную заявку, поступившую через государственный портал.`,more:`Событие стало первым практическим испытанием электронной формы гражданства. Система была проверена на корректность заполнения полей и передачу заявки в Formspree.`},programs:{date:'30 сентября 2026',cat:'Государственные услуги',title:'Запущены заявки на образование и здравоохранение',text:`На портале появились отдельные страницы двух государственных программ: образования и здравоохранения.`,more:`Гражданин может войти в личный кабинет, открыть нужную программу и заполнить заявку. Данные серии, номера, ФИО и сведений о выдаче паспорта подставляются автоматически.`},bugfix:{date:'1 октября 2026',cat:'Цифровая инфраструктура',title:'На государственном портале исправлены ошибки',text:`1 октября 2026 года на государственном портале были исправлены обнаруженные ошибки в работе отдельных страниц и личного кабинета.`,more:`В частности, обновлена логика входа в личный кабинет по серии и номеру гражданского паспорта. Также исправлены отдельные элементы навигации и отображения данных.`}};
items.decrees456={date:'4 ноября 2026',cat:'Государственные акты',title:'Опубликованы указы №4, №5 и №6',text:'В архиве опубликованы три новых указа Верховного Господина, посвящённые территориальной целостности Украины и Грузии, а также дипломатическому демаршу в отношении Российской Федерации.',more:'Указ №4 фиксирует позицию ИРНР о границах Украины по состоянию на 5 декабря 1994 года. Указ №5 посвящён международно признанным границам Грузии до войны августа 2008 года. Указ №6 содержит требование прекратить военные действия против Украины и поручение подготовить дипломатическое обращение.',link:'archive.html',linkText:'Открыть архив указов →'};items.decree7={date:'4 ноября 2026',cat:'Внешняя политика',title:'Опубликован указ №7 о позиции в отношении КНР, КНДР и РФ',text:'В рамках ролевого проекта опубликован указ, фиксирующий позицию ИРНР о непризнании территориальной целостности Китайской Народной Республики, Корейской Народно-Демократической Республики и Российской Федерации.',more:'Документ отдельно подчёркивает, что заявление не означает автоматического признания каких-либо конкретных территориальных претензий и не является призывом к насильственному изменению границ.',link:'decree-7.html',linkText:'Открыть указ №7 →'};
