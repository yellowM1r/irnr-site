<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Гражданство — ИРНР</title><link rel="stylesheet" href="style.css"></head><body class="application-page"><header class="top"><div class="brand"><div class="flag"><img src="https://raw.githubusercontent.com/yellowM1r/irnr-site/main/irnr_flag.png"></div><div><b>ИРНР</b><small>Государственные услуги</small></div></div><div><a class="back" href="index.html">← Портал</a></div></header><main class="page-wrap"><div class="eyebrow">Государственная услуга</div><h1>Заявление на гражданство</h1><div class="form-card"><p class="form-note">Заполните заявление. Для ролевого проекта данные используются только внутри сайта и не создают реальных юридических последствий.</p><form action="https://formspree.io/f/xljdvork" method="POST"><div class="form-grid"><div class="field"><label>Фамилия</label><input name="surname" required></div><div class="field"><label>Имя</label><input name="name" required></div><div class="field"><label>Отчество</label><input name="patronymic" required></div><div class="field"><label>Дата рождения</label><input name="birthdate" type="date"></div><div class="field"><label>Контакт</label><input name="contact" type="email" placeholder="Email"></div><div class="field"><label>Гражданство</label><input name="citizenship" placeholder="Текущее гражданство"></div><div class="field full"><label>Почему вы хотите получить гражданство?</label><textarea name="reason" required></textarea></div></div><button class="btn primary" type="submit">Отправить заявление</button></form></div></main><script src="script.js"></script></body></html>
