<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Citizenship application — IRNR</title><link rel="stylesheet" href="style.css"></head><body class="application-page"><header class="top"><div class="brand"><div class="flag"><img src="https://raw.githubusercontent.com/yellowM1r/irnr-site/main/irnr_flag.png"></div><div><b>IRNR</b><small>Citizenship office</small></div></div><div class="header-actions"><button id="themeToggle" class="theme-btn">☾</button><a class="back-link" href="index-en.html">← Portal</a></div></header><main class="application-wrap"><div class="application-card"><div class="eyebrow">Government service</div><h1>IRNR citizenship application</h1><p class="intro">Fill in the form below. Submissions are delivered through the connected Formspree form.</p><form action="https://formspree.io/f/xljdvork" method="POST"><input type="hidden" name="subject" value="New IRNR citizenship application"><div class="form-grid"><div class="form-field"><label>First name *</label><input name="First name" required></div><div class="form-field"><label>Last name *</label><input name="Last name" required></div><div class="form-field"><label>Patronymic</label><input name="Patronymic"></div><div class="form-field"><label>Date of birth</label><input name="Date of birth" type="date"></div><div class="form-field"><label>Current citizenship *</label><input name="Current citizenship" required></div><div class="form-field"><label>Country of residence</label><input name="Country of residence"></div><div class="form-field"><label>E-mail *</label><input name="email" type="email" required></div><div class="form-field"><label>Telegram</label><input name="Telegram"></div><div class="form-field full"><label>Reason *</label><textarea name="Reason" required></textarea></div></div><label class="consent"><input type="checkbox" required><span>I agree to the use of the submitted information for reviewing this role-play application.</span></label><button class="submit-btn">Submit application</button></form></div></main><script src="script.js"></script></body></html>
